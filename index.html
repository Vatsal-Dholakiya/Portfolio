    <!-- Before first paint: show the intro once per session (never with reduced motion), with a safety net -->
    <script>
      ;(function () {
        var d = document.documentElement
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('vd-intro')) {
            d.classList.add('show-intro')
          }
        } catch (e) {}
        setTimeout(function () {
          if (!window.__vdReady) d.classList.remove('show-intro')
        }, 3000)
      })()
