    <!-- Runs before first paint: theme, animation flags, and a safety net if the app fails to start -->
    <script>
      ;(function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('theme')
          d.dataset.theme =
            t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('js-anim')
          try {
            if (!sessionStorage.getItem('vd-preloaded')) d.classList.add('show-preloader')
          } catch (e) {}
        }
        setTimeout(function () {
          if (!window.__vdReady) d.classList.remove('js-anim', 'show-preloader')
        }, 4000)
      })()
    </script>
