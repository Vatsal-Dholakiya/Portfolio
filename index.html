<!doctype html>
<html lang="en-GB" style="background: #050607; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <meta name="color-scheme" content="dark" />
    <!--seo-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: Google Fonts with preconnect, font-display: swap, non-blocking; fallbacks are metric-matched in globals.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      />
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <!-- Before first paint: the hero build sequence once per session (not with reduced motion or a #section link); 404 detection -->
    <script>
      ;(function () {
        var d = document.documentElement
        var base = '%BASE%'
        var path = location.pathname
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '')
        var isHome = base.charAt(0) !== '/' || rest === '' || rest === 'index.html'
        if (!isHome) {
          d.classList.add('nf')
        } else {
          try {
            if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !location.hash && !sessionStorage.getItem('vd-built')) {
              d.classList.add('js-build')
            }
          } catch (e) {}
        }
        // Safety net: if the app has not started after 4 seconds, show the plain page
        setTimeout(function () {
          if (!window.__vdReady) d.classList.remove('js-build', 'nf')
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
